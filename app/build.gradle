plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Enable Firebase only when the config file is present, so the project still
// builds (and the app still runs, without Firebase features) when it is absent.
if (project.file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'com.fliptle.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.fliptle.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // A committed, stable debug key so every CI build is signed identically.
        // Without this, each ephemeral CI runner generates a random debug key and
        // installs fail with a signature mismatch when updating in place.
        debug {
            storeFile file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Release signing: NEVER committed. Populated entirely from environment
        // variables that only exist in CI (set from GitHub Actions secrets — see
        // .github/workflows/release.yml). A local `./gradlew bundleRelease` with
        // none of these set simply produces an unsigned release build instead of
        // failing, since the `release` signingConfig below is applied
        // conditionally on RELEASE_KEYSTORE_PATH being present.
        release {
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Developer tools (fast freeze cycles, fast Reels cooldowns, surface
            // id logging) exist ONLY in debug builds. Even here they stay hidden
            // behind a gesture — see DevMode.
            buildConfigField "boolean", "DEV_TOOLS", "true"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Hard off in release: DevMode short-circuits, so no debug timing or
            // developer UI is reachable in a shipped build.
            buildConfigField "boolean", "DEV_TOOLS", "false"
            // Only signed when the release keystore env vars are present (CI).
            // See the release signingConfig above.
            if (System.getenv("RELEASE_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        // Needed for libraries that use java.time on minSdk < 26 (e.g. Firebase).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Firebase (phone auth, install tracking, analytics, remote config).
    // These compile without google-services.json; they are only active at
    // runtime when the config is present and Firebase initializes.
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-config'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    // Local JVM unit tests (pure logic only, no Android framework)
    testImplementation 'junit:junit:4.13.2'
}
